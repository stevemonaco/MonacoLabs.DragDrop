name: CI

on:
  # main and PRs only, so a PR branch is not built twice per push.
  push:
    branches: [main]
    paths: ['**', '!**.md', '!.claude/**']
  pull_request:
    paths: ['**', '!**.md', '!.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet --info
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - run: dotnet restore MonacoLabs.DragDrop.slnx
      - run: dotnet format MonacoLabs.DragDrop.slnx --verify-no-changes --no-restore
        if: runner.os == 'Windows'
      - run: dotnet build MonacoLabs.DragDrop.slnx --configuration Release --no-restore
      - run: >-
          dotnet test --project MonacoLabs.DragDrop.Tests --configuration Release --no-build --report-xunit --results-directory TestResults
          ${{ runner.os == 'Windows' && '--coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml' || '' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ runner.os }}
          path: TestResults
      - uses: actions/upload-artifact@v7
        if: success() && runner.os == 'Windows'
        with:
          name: coverage
          path: TestResults/coverage.cobertura.xml
